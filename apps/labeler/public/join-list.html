<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waitlist — NaturaLens</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Archivo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css?v=12" />
  </head>
  <body class="page">
    <header class="top">
      <div class="brand">
        <img class="mark" src="/owl.png" width="28" height="28" alt="" />
        <div>
          <p class="kicker">NaturaLens field desk</p>
          <h1>Waitlist</h1>
        </div>
      </div>
      <nav class="nav">
        <a href="/">Label</a>
        <a href="/upload.html">Upload</a>
        <a href="/runs.html">Runs</a>
        <a href="/join-list" aria-current="page">Waitlist</a>
      </nav>
      <p class="progress" id="progress">Loading signups…</p>
    </header>
    <main class="page-main">
      <section class="panel">
        <div class="panel-head">
          <h2>Landing page signups</h2>
          <div class="run-actions">
            <button type="button" class="ghost" id="copyBtn" disabled>Copy emails</button>
            <button type="button" class="ghost" id="refreshBtn">Refresh</button>
          </div>
        </div>
        <p class="hint" id="hint">Emails from the Naturalens.ca waitlist.</p>
        <div class="waitlist-table-wrap">
          <table class="waitlist-table">
            <thead>
              <tr>
                <th scope="col">Email</th>
                <th scope="col">Joined</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p class="empty" id="empty" hidden>No waitlist emails yet.</p>
      </section>
    </main>
    <div class="toast" id="toast" hidden></div>
    <script src="/join-list.js"></script>
  </body>
</html>
