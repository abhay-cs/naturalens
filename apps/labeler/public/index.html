<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skim — NaturaLens labeler</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Archivo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css?v=9" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img class="mark" src="/owl.png" width="28" height="28" alt="" />
        <div>
          <p class="kicker">NaturaLens field desk</p>
          <h1>Skim</h1>
        </div>
      </div>
      <nav class="nav">
        <a href="/" aria-current="page">Label</a>
        <a href="/upload.html">Upload</a>
        <a href="/runs.html">Runs</a>
      </nav>
      <p class="progress" id="progress">Loading photos…</p>
      <p class="quota" id="quota" title="R2 free-tier guard"></p>
      <p class="save-state" id="saveState" data-state="idle">Saved</p>
    </header>

    <main class="shell">
      <aside class="rail" aria-label="Photo list">
        <div class="rail-head">
          <h2>Photos</h2>
          <label class="filter">
            <input type="checkbox" id="needsWork" checked />
            Needs work first
          </label>
        </div>
        <div class="film" id="film"></div>
      </aside>

      <section class="stage-wrap">
        <div class="stage" id="stage">
          <div class="world" id="world">
            <img id="photo" alt="Field photo" draggable="false" />
            <div id="boxes"></div>
            <div id="draft" hidden></div>
          </div>
          <p class="empty-stage" id="emptyStage" hidden>No photos yet. Upload some first.</p>
        </div>
        <div class="bar">
          <div class="bar-left">
            <button type="button" class="ghost" id="prevBtn" title="Previous (←)">Prev</button>
            <button type="button" class="ghost" id="nextBtn" title="Next (→)">Next</button>
            <span class="file-name" id="fileName"></span>
          </div>
          <div class="bar-mid">
            <button type="button" class="ghost" id="drawBtn" title="Draw a box (A)">Draw</button>
            <button type="button" class="ghost" id="mergeBtn" title="Merge boxes into one (M)">Merge into 1</button>
            <button type="button" class="ghost danger" id="deleteBtn" title="Delete selected (⌫)">Delete</button>
          </div>
          <div class="bar-right">
            <button type="button" class="primary" id="doneBtn" title="Looks right, next (Space)">
              Looks right
            </button>
          </div>
        </div>
      </section>

      <aside class="inspect" aria-label="Box list">
        <h2 id="inspectTitle">Bears</h2>
        <p class="hint" id="flagHint"></p>
        <ol class="bear-list" id="bearList"></ol>
        <div class="keys">
          <h3>Keys</h3>
          <dl>
            <div><dt>← →</dt><dd>Photo</dd></div>
            <div><dt>Space</dt><dd>Looks right</dd></div>
            <div><dt>A</dt><dd>Draw box</dd></div>
            <div><dt>M</dt><dd>Merge</dd></div>
            <div><dt>⌫</dt><dd>Delete</dd></div>
            <div><dt>Z</dt><dd>Undo</dd></div>
            <div><dt>N</dt><dd>Next unchecked</dd></div>
          </dl>
        </div>
      </aside>
    </main>
    <div class="toast" id="toast" hidden></div>
    <script src="/quota.js?v=4"></script>
    <script src="/app.js?v=4"></script>
  </body>
</html>
